[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent"
version = "0.1.0"
description = "Requirements-to-Reviewable-PR agent pipeline: orchestrator + 8 subagents with human approval gates and a security/governance foundation."
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2.100"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
